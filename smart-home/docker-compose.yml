# Hybrid Windows: FastAPI + AI runs in backend/.venv on the Windows host.
# Only the Next.js dashboard is containerized.
name: smarthome

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
      args:
        API_TARGET: http://host.docker.internal:8000
    image: smarthome-dashboard:hybrid
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6
